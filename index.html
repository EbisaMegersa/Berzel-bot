<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            height: 100vh;
            font-family: sans-serif;
        }

        .color-strip {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            min-width: 100px;
        }

        /* The Blues */
        .alice-blue { background-color: #F0F8FF; color: #333; text-shadow: none; }
        .sky-blue   { background-color: #87CEEB; }
        .dodger-blue { background-color: #1E90FF; }
        .royal-blue  { background-color: #4169E1; }
        .navy        { background-color: #000080; }
    </style>
</head>
<body>

    <div class="color-strip alice-blue">Alice Blue</div>
    <div class="color-strip sky-blue">Sky Blue</div>
    <div class="color-strip dodger-blue">Dodger Blue</div>
    <div class="color-strip royal-blue">Royal Blue</div>
    <div class="color-strip navy">Navy</div>

</body>
</html>
